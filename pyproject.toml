[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-agent-skills"
version = "1.0.0"
description = "Version-aware Minecraft agent skill and knowledge infrastructure"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
minecraft-skills = "tools.cli:main"

[tool.setuptools]
packages = ["tools"]
