name: Validate skills and examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tools.cli validate
      - run: python -m tools.cli test
      - run: python -m pip install jsonschema==4.25.1 PyYAML==6.0.2
      - run: python -m tools.standards_check
  paper-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -f examples/paper-plugin/pom.xml -B package
      - name: Inspect packaged descriptor and API exclusion
        shell: python
        run: |
          import zipfile
          with zipfile.ZipFile('build/paper-example/agent-check-1.0.0.jar') as jar:
              names = jar.namelist()
              assert 'plugin.yml' in names
              assert 'org/minecraftskills/AgentCheck.class' in names
              assert not any(n.startswith(('org/bukkit/', 'io/papermc/')) for n in names)
